<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"><text x="320" y="65" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" fill="#a9dfb7">条件 → 结论</text><rect x="40" y="120" width="230" height="100" rx="20" fill="#a9dfb71a"/><rect x="370" y="120" width="230" height="100" rx="20" fill="#a6b3ee1a"/><text x="155" y="178" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" fill="#a9dfb7">被4整除</text><text x="320" y="180" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="38" fill="#efb16f">⇒</text><text x="485" y="178" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" fill="#a6b3ee">偶数</text><text x="320" y="282" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" fill="#a9dfb7">4、8、12……都能走到右边</text><text x="320" y="332" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" fill="#efb16f">反过来试试6：是偶数，却不是4的倍数。</text></svg>