<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"><text x="320" y="65" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" fill="#a9dfb7">“所有”需要每一个都通过</text><circle cx="110" cy="170" r="38" fill="#a9dfb718" stroke="#a9dfb7" stroke-width="2"/><text x="110" y="178" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" fill="#a9dfb7">✓</text><circle cx="250" cy="170" r="38" fill="#a9dfb718" stroke="#a9dfb7" stroke-width="2"/><text x="250" y="178" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" fill="#a9dfb7">✓</text><circle cx="390" cy="170" r="38" fill="#efb16f18" stroke="#efb16f" stroke-width="2"/><text x="390" y="178" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" fill="#efb16f">×</text><circle cx="530" cy="170" r="38" fill="#a9dfb718" stroke="#a9dfb7" stroke-width="2"/><text x="530" y="178" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" fill="#a9dfb7">✓</text><text x="320" y="280" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#efb16f">一个反例，就能推翻“所有都对”。</text><text x="320" y="329" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" fill="#aac5b7">“存在”只要找到一个符合条件的。</text></svg>