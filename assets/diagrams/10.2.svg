<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">独立事件：前一步不会改变后一步的机会</text><rect x="65" y="110" width="190" height="130" rx="8" stroke="#A9DFB7" stroke-width="2" fill="#A9DFB710"/><text x="160" y="158" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" text-anchor="middle">硬币正面</text><text x="160" y="207" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">P=1/2</text><text x="320" y="190" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="40" text-anchor="middle">×</text><rect x="385" y="110" width="190" height="130" rx="8" stroke="#A6B3EE" stroke-width="2" fill="#A6B3EE10"/><text x="480" y="158" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" text-anchor="middle">骰子为6</text><text x="480" y="207" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">P=1/6</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">同时发生的概率 = 1/2 × 1/6 = 1/12</text></svg>