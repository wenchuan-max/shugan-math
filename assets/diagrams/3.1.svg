<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"><text x="320" y="60" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" fill="#a9dfb7">输入质量 → 按规则计算 → 输出总价</text><rect x="230" y="120" width="180" height="110" rx="20" fill="#a9dfb71a" stroke="#a9dfb7"/><text x="100" y="182" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" fill="#efb16f">2千克</text><text x="190" y="182" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="30" fill="#a6b3ee">→</text><text x="320" y="170" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" fill="#a9dfb7">× 6元/千克</text><text x="320" y="205" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#aac5b7">规则 f(x)=6x</text><text x="452" y="182" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="30" fill="#a6b3ee">→</text><text x="550" y="182" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" fill="#efb16f">12元</text><text x="320" y="315" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" fill="#aac5b7">每个允许的输入，只有一个确定的输出。</text></svg>