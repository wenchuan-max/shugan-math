<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"><text x="320" y="65" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" fill="#a9dfb7">指数每减1，结果除以2</text><text x="320" y="150" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29" fill="#a6b3ee">2³ → 2² → 2¹ → 2⁰ → 2⁻¹</text><text x="320" y="235" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="31" fill="#efb16f">8 → 4 → 2 → 1 → 1/2</text><text x="320" y="325" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" fill="#aac5b7">负指数表示倒数，不表示负数。</text></svg>