<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"><text x="320" y="65" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" fill="#a9dfb7">同一件事，换个方向问</text><text x="320" y="158" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="48" fill="#efb16f">2³ = 8</text><text x="320" y="228" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="35" fill="#a6b3ee">⇅</text><text x="320" y="302" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="42" fill="#a9dfb7">log₂ 8 = 3</text></svg>