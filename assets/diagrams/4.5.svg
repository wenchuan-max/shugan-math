<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"><text x="320" y="45" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" fill="#a9dfb7">每次保留一半，答案越来越近</text><line x1="80" y1="100" x2="560" y2="100" stroke="#a9dfb7" stroke-width="7"/><text x="80" y="132" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#aac5b7">1</text><text x="560" y="132" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#aac5b7">2</text><line x1="80" y1="180" x2="320" y2="180" stroke="#a9dfb7" stroke-width="7"/><text x="80" y="212" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#aac5b7">1</text><text x="320" y="212" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#aac5b7">1.5</text><line x1="200" y1="260" x2="320" y2="260" stroke="#efb16f" stroke-width="7"/><text x="200" y="292" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#aac5b7">1.25</text><text x="320" y="292" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#aac5b7">1.5</text><text x="320" y="354" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" fill="#aac5b7">f(x)=x²−2，正根在保留下来的区间里。</text></svg>