<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"><text x="320" y="65" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" fill="#efb16f">sin(α+β) 不是 sinα+sinβ</text><text x="320" y="148" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27" fill="#a9dfb7">sin(30°+30°) = √3/2</text><text x="320" y="223" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27" fill="#a6b3ee">sin30° + sin30° = 1</text><text x="320" y="315" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" fill="#aac5b7">相加的是角，坐标要按和角公式计算。</text></svg>