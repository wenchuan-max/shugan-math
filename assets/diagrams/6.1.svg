<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">向量：方向和长度一起看</text><line x1="95" y1="260" x2="265" y2="160" stroke="#A9DFB7" stroke-width="5"/><path d="M265 160 l-7.7538636210733465 10.434442914971328 M265 160 l-12.887379988362762 1.7074650905793236" stroke="#A9DFB7" stroke-width="5" fill="none"/><line x1="340" y1="225" x2="510" y2="125" stroke="#A6B3EE" stroke-width="5"/><path d="M510 125 l-7.7538636210733465 10.434442914971328 M510 125 l-12.887379988362762 1.7074650905793236" stroke="#A6B3EE" stroke-width="5" fill="none"/><text x="150" y="145" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" text-anchor="middle">向东3、向北2</text><text x="435" y="275" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">搬了位置，向量没变</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">两支箭头同方向、同长度，表示同一向量。</text></svg>