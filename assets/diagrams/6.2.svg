<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">首尾相接，就是向量相加</text><line x1="100" y1="280" x2="340" y2="280" stroke="#A9DFB7" stroke-width="5"/><path d="M340 280 l-11.973792922037507 5.062438450012457 M340 280 l-11.973792922037507 -5.062438450012457" stroke="#A9DFB7" stroke-width="5" fill="none"/><line x1="340" y1="280" x2="480" y2="100" stroke="#A6B3EE" stroke-width="5"/><path d="M480 100 l-3.355150756807812 12.559576561297437 M480 100 l-11.347244788504824 6.343503425533096" stroke="#A6B3EE" stroke-width="5" fill="none"/><line x1="100" y1="280" x2="480" y2="100" stroke="#EFB16F" stroke-width="5"/><path d="M480 100 l-8.654008967188698 9.700934429003095 M480 100 l-12.988330510253153 0.550700060311467" stroke="#EFB16F" stroke-width="5" fill="none"/><text x="230" y="312" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">a</text><text x="445" y="210" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">b</text><text x="245" y="155" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" text-anchor="middle">a+b</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">从起点直接走到终点，就是合向量。</text></svg>