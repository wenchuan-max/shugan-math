<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">解三角形：边和角互相帮忙</text><polyline points="150,300 454,300 150,72 150,300" stroke="#A9DFB7" stroke-width="3" fill="none" stroke-linejoin="round"/><polyline points="150,275 175,275 175,300" stroke="#729589" stroke-width="3" fill="none" stroke-linejoin="round"/><text x="302" y="328" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">4</text><text x="120" y="195" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">3</text><text x="329" y="172" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">5</text><text x="206" y="285" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">90°</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">3²+4²=5²；sin右下角 = 3/5。</text></svg>