<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">三角形的重心：三条中线交在一点</text><polyline points="100,290 540,290 280,75 100,290" stroke="#A9DFB7" stroke-width="3" fill="none" stroke-linejoin="round"/><line x1="100" y1="290" x2="410" y2="182.5" stroke="#A6B3EE" stroke-width="2"/><line x1="540" y1="290" x2="190" y2="182.5" stroke="#A6B3EE" stroke-width="2"/><line x1="280" y1="75" x2="320" y2="290" stroke="#EFB16F" stroke-width="3"/><circle cx="306.667" cy="218.333" r="7" fill="#EFB16F"/><circle cx="320" cy="290" r="5" fill="#A6B3EE"/><text x="100" y="320" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">A</text><text x="540" y="320" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">B</text><text x="275" y="65" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">C</text><text x="320" y="319" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">M</text><text x="278" y="220" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" text-anchor="middle">G</text><text x="404" y="117" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">CG:GM=2:1</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">中线连接顶点与对边中点；顶点到G的距离为中线长的2/3。</text></svg>