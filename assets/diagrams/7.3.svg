<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">复数的三角形式：长度＋方向</text><line x1="120" y1="280" x2="540" y2="280" stroke="#729589" stroke-width="2"/><path d="M540 280 l-11.973792922037507 5.062438450012457 M540 280 l-11.973792922037507 -5.062438450012457" stroke="#729589" stroke-width="2" fill="none"/><line x1="210" y1="310" x2="210" y2="65" stroke="#729589" stroke-width="2"/><path d="M210 65 l5.062438450012454 11.973792922037507 M210 65 l-5.062438450012456 11.973792922037507" stroke="#729589" stroke-width="2" fill="none"/><line x1="210" y1="280" x2="330" y2="72" stroke="#A9DFB7" stroke-width="4"/><path d="M330 72 l-1.5985619609177064 12.901341002279837 M330 72 l-10.368584392235723 7.841712676519443" stroke="#A9DFB7" stroke-width="4" fill="none"/><line x1="330" y1="72" x2="330" y2="280" stroke="#EFB16F" stroke-width="2" stroke-dasharray="6 5"/><text x="252" y="168" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">r=2</text><text x="275" y="250" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">60°</text><text x="405" y="95" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">z=1+√3 i</text><text x="320" y="317" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">横坐标1</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">z = 2(cos60° + i sin60°)</text></svg>