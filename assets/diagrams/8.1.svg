<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">从面到体：观察棱、面和顶点</text><polyline points="210,260 350,260 350,120 210,120 210,260" stroke="#A9DFB7" stroke-width="3" fill="none" stroke-linejoin="round"/><polyline points="210,120 275,55 415,55 350,120" stroke="#A9DFB7" stroke-width="3" fill="none" stroke-linejoin="round"/><polyline points="350,260 415,195 415,55" stroke="#A9DFB7" stroke-width="3" fill="none" stroke-linejoin="round"/><line x1="210" y1="260" x2="275" y2="195" stroke="#729589" stroke-width="2" stroke-dasharray="6 5"/><line x1="275" y1="195" x2="275" y2="55" stroke="#729589" stroke-width="2" stroke-dasharray="6 5"/><line x1="275" y1="195" x2="415" y2="195" stroke="#729589" stroke-width="2" stroke-dasharray="6 5"/><text x="435" y="125" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">6个面</text><text x="455" y="180" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">12条棱</text><text x="455" y="235" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">8个顶点</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">正方体：每个面都是正方形。</text></svg>