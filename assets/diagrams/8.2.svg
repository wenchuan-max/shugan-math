<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">斜二测：竖着画的方向，斜着画一半</text><polyline points="80,260 250,260 250,90 80,90 80,260" stroke="#A6B3EE" stroke-width="3" fill="none" stroke-linejoin="round"/><text x="165" y="300" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">原来的正方形</text><polyline points="355,260 520,260 575,205 410,205 355,260" stroke="#A9DFB7" stroke-width="3" fill="none" stroke-linejoin="round"/><line x1="292" y1="195" x2="330" y2="195" stroke="#EFB16F" stroke-width="3"/><path d="M330 195 l-11.973792922037507 5.062438450012457 M330 195 l-11.973792922037507 -5.062438450012457" stroke="#EFB16F" stroke-width="3" fill="none"/><text x="465" y="130" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">斜边按原长的一半画</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">水平长度保留；另一方向倾斜45°。</text></svg>