<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">证明线面平行：先在面里找一条平行线</text><polyline points="120,285 450,285 550,190 220,190 120,285" stroke="#729589" stroke-width="3" fill="none" stroke-linejoin="round"/><line x1="190" y1="238" x2="470" y2="238" stroke="#A9DFB7" stroke-width="4"/><path d="M470 238 l-11.973792922037507 5.062438450012457 M470 238 l-11.973792922037507 -5.062438450012457" stroke="#A9DFB7" stroke-width="4" fill="none"/><line x1="160" y1="120" x2="440" y2="120" stroke="#A6B3EE" stroke-width="4"/><path d="M440 120 l-11.973792922037507 5.062438450012457 M440 120 l-11.973792922037507 -5.062438450012457" stroke="#A6B3EE" stroke-width="4" fill="none"/><text x="300" y="96" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" text-anchor="middle">面外直线 a</text><text x="340" y="270" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" text-anchor="middle">面内直线 b</text><text x="520" y="306" fill="#729589" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">α</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">a∥b，b在平面α内，且a在α外 ⇒ a∥α</text></svg>