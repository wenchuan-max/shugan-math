<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">证明线面垂直：检查面内两条相交线</text><polyline points="110,280 460,280 550,180 200,180 110,280" stroke="#729589" stroke-width="3" fill="none" stroke-linejoin="round"/><line x1="180" y1="235" x2="480" y2="235" stroke="#A9DFB7" stroke-width="3"/><line x1="260" y1="280" x2="360" y2="190" stroke="#A6B3EE" stroke-width="3"/><line x1="310" y1="235" x2="310" y2="75" stroke="#EFB16F" stroke-width="4"/><path d="M310 75 l5.062438450012454 11.973792922037507 M310 75 l-5.062438450012456 11.973792922037507" stroke="#EFB16F" stroke-width="4" fill="none"/><polyline points="310,213 332,213 332,235" stroke="#EFB16F" stroke-width="3" fill="none" stroke-linejoin="round"/><text x="370" y="113" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">垂直于两条相交线</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">一条直线同时垂直于它们，就垂直于这个面。</text></svg>