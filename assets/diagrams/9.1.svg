 cx="434" cy="256" r="9" fill="#729589"/><circle cx="481" cy="256" r="9" fill="#729589"/><circle cx="528" cy="256" r="9" fill="#729589"/><text x="320" y="315" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">从40人名单中随机抽取6人</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">抽之前，任何一人被选中的概率都是 6/40。</text></svg>