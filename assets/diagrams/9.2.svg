<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">平均数看中心，方差看分散</text><line x1="90" y1="190" x2="550" y2="190" stroke="#729589" stroke-width="3"/><circle cx="140" cy="190" r="10" fill="#A6B3EE"/><text x="140" y="228" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">2</text><circle cx="320" cy="190" r="10" fill="#A9DFB7"/><text x="320" y="228" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">4</text><circle cx="500" cy="190" r="10" fill="#EFB16F"/><text x="500" y="228" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">6</text><line x1="140" y1="190" x2="320" y2="190" stroke="#A6B3EE" stroke-width="5"/><line x1="320" y1="190" x2="500" y2="190" stroke="#EFB16F" stroke-width="5"/><text x="320" y="110" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">平均数 x̄ = (2+4+6)/3 = 4</text><text x="320" y="290" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">方差 = [(-2)²+0²+2²]/3</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">方差 = 8/3；偏离平均数越远，方差越大。</text></svg>