<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">调查身体数据：先收集，再按规则分析</text><rect x="65" y="90" width="245" height="220" rx="8" stroke="#A9DFB7" stroke-width="2" fill="#A9DFB710"/><text x="187" y="130" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">同一个人的两项数据</text><text x="187" y="184" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">体重：60 kg</text><text x="187" y="230" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">身高：1.70 m</text><text x="455" y="150" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">BMI = 60 ÷ 1.70²</text><text x="455" y="210" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32" text-anchor="middle">≈ 20.8</text><text x="455" y="275" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">再统计不同区间的人数</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">统计调查还要记录抽样方式、样本数与年龄。</text></svg>