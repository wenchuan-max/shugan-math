<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">空间基底：三种不共面的方向足够了</text><line x1="160" y1="275" x2="360" y2="275" stroke="#A9DFB7" stroke-width="4"/><path d="M360 275 l-11.973792922037507 5.062438450012457 M360 275 l-11.973792922037507 -5.062438450012457" stroke="#A9DFB7" stroke-width="4" fill="none"/><line x1="160" y1="275" x2="90" y2="210" stroke="#A6B3EE" stroke-width="4"/><path d="M90 210 l12.219059332140285 4.4378586094686945 M90 210 l5.329575714559978 11.857302505324409" stroke="#A6B3EE" stroke-width="4" fill="none"/><line x1="160" y1="275" x2="160" y2="120" stroke="#EFB16F" stroke-width="4"/><path d="M160 120 l5.062438450012454 11.973792922037507 M160 120 l-5.062438450012456 11.973792922037507" stroke="#EFB16F" stroke-width="4" fill="none"/><text x="375" y="280" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">e₁</text><text x="75" y="200" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">e₂</text><text x="160" y="100" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">e₃</text><text x="420" y="155" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" text-anchor="middle">a=2e₁+e₂+3e₃</text><text x="420" y="218" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">三方向不能挤在同一平面</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">确定基底后，每个空间向量都有唯一的坐标。</text></svg>