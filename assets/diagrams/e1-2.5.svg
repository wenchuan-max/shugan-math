<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">直线与圆：比一比圆心到直线的距离</text><circle cx="180" cy="190" r="92" fill="none" stroke="#A9DFB7" stroke-width="2.5"/><line x1="55" y1="190" x2="305" y2="190" stroke="#EFB16F" stroke-width="3"/><line x1="365" y1="98" x2="605" y2="98" stroke="#A6B3EE" stroke-width="3"/><circle cx="485" cy="190" r="92" fill="none" stroke="#A9DFB7" stroke-width="2.5"/><line x1="485" y1="190" x2="485" y2="98" stroke="#EFB16F" stroke-width="2" stroke-dasharray="6 5"/><text x="180" y="310" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">d&lt;r：两个交点</text><text x="485" y="310" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">d=r：一个切点</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">d&gt;r 时，直线与圆没有公共点。</text></svg>