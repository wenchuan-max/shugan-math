<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">数列：按顺序摆好的数</text><rect x="55" y="120" width="88" height="80" rx="8" stroke="#A9DFB7" stroke-width="2" fill="none"/><text x="99" y="171" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32" text-anchor="middle">2</text><text x="99" y="245" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">第1项</text><rect x="170" y="120" width="88" height="80" rx="8" stroke="#A9DFB7" stroke-width="2" fill="none"/><text x="214" y="171" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32" text-anchor="middle">4</text><text x="214" y="245" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">第2项</text><rect x="285" y="120" width="88" height="80" rx="8" stroke="#EFB16F" stroke-width="2" fill="none"/><text x="329" y="171" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32" text-anchor="middle">6</text><text x="329" y="245" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">第3项</text><rect x="400" y="120" width="88" height="80" rx="8" stroke="#A9DFB7" stroke-width="2" fill="none"/><text x="444" y="171" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32" text-anchor="middle">8</text><text x="444" y="245" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">第4项</text><rect x="515" y="120" width="88" height="80" rx="8" stroke="#A9DFB7" stroke-width="2" fill="none"/><text x="559" y="171" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32" text-anchor="middle">10</text><text x="559" y="245" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">第5项</text><text x="320" y="305" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">aₙ=2n：输入位置n，得到第n项</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">同样是这些数，换了顺序就是另一条数列。</text></svg>