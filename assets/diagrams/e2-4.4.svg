<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">数学归纳法：起点站稳，每一步都能接上</text><rect x="60" y="115" width="125" height="140" rx="8" stroke="#A9DFB7" stroke-width="2" fill="#A9DFB712"/><text x="122" y="165" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">第一块</text><text x="122" y="210" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">成立</text><line x1="205" y1="185" x2="295" y2="185" stroke="#EFB16F" stroke-width="4"/><path d="M295 185 l-11.973792922037507 5.062438450012457 M295 185 l-11.973792922037507 -5.062438450012457" stroke="#EFB16F" stroke-width="4" fill="none"/><rect x="320" y="115" width="260" height="140" rx="8" stroke="#A6B3EE" stroke-width="2" fill="#A6B3EE12"/><text x="450" y="165" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">假设第 k 步成立</text><text x="450" y="215" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">推出第 k+1 步</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">先证n=1，再证“k成立 ⇒ k+1成立”。</text></svg>