<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">求导法则：幂次下移，指数减一</text><text x="175" y="145" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="50" text-anchor="middle">x⁴</text><line x1="260" y1="130" x2="375" y2="130" stroke="#EFB16F" stroke-width="4"/><path d="M375 130 l-11.973792922037507 5.062438450012457 M375 130 l-11.973792922037507 -5.062438450012457" stroke="#EFB16F" stroke-width="4" fill="none"/><text x="475" y="145" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="50" text-anchor="middle">4x³</text><text x="320" y="238" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="30" text-anchor="middle">(xⁿ)′ = nxⁿ⁻¹</text><text x="320" y="301" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">例：(3x²+2x−5)′ = 6x+2</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">常数的导数是0；加减可以分别求导。</text></svg>