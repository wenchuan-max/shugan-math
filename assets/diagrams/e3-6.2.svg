<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">排列看顺序，组合只看选了谁</text><rect x="40" y="90" width="270" height="220" rx="8" stroke="#A9DFB7" stroke-width="2" fill="#A9DFB70C"/><rect x="330" y="90" width="270" height="220" rx="8" stroke="#A6B3EE" stroke-width="2" fill="#A6B3EE0C"/><text x="175" y="130" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">排列：3人中选2人排队</text><text x="465" y="130" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">组合：3人中选2人组队</text><text x="175" y="185" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">AB  AC  BA</text><text x="175" y="230" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">BC  CA  CB</text><text x="465" y="195" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" text-anchor="middle">AB  AC  BC</text><text x="175" y="278" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" text-anchor="middle">6种</text><text x="465" y="278" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" text-anchor="middle">3种</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">AB和BA：排队算两种，组队只算一种。</text></svg>