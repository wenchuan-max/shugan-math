<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">离散分布：把每个取值的概率摆出来</text><line x1="105" y1="285" x2="555" y2="285" stroke="#729589" stroke-width="2"/><rect x="150" y="205" width="75" height="80" rx="0" stroke="#A9DFB7" stroke-width="2" fill="#A9DFB720"/><text x="187" y="312" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">0</text><text x="187" y="190" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">0.25</text><rect x="290" y="125" width="75" height="160" rx="0" stroke="#EFB16F" stroke-width="2" fill="#EFB16F20"/><text x="327" y="312" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">1</text><text x="327" y="110" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">0.5</text><rect x="430" y="205" width="75" height="80" rx="0" stroke="#A6B3EE" stroke-width="2" fill="#A6B3EE20"/><text x="467" y="312" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">2</text><text x="467" y="190" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">0.25</text><text x="320" y="80" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">掷两次硬币，X=正面个数</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">P(X=0)+P(X=1)+P(X=2) = 1</text></svg>