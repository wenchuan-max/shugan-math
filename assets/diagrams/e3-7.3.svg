<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">期望是概率加权的平均数</text><text x="320" y="95" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">X：掷两次硬币的正面个数</text><circle cx="160" cy="175" r="40" fill="none" stroke="#A9DFB7" stroke-width="2.5"/><text x="160" y="184" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32" text-anchor="middle">0</text><text x="160" y="248" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" text-anchor="middle">1/4</text><circle cx="320" cy="175" r="40" fill="none" stroke="#EFB16F" stroke-width="2.5"/><text x="320" y="184" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32" text-anchor="middle">1</text><text x="320" y="248" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" text-anchor="middle">1/2</text><circle cx="480" cy="175" r="40" fill="none" stroke="#A6B3EE" stroke-width="2.5"/><text x="480" y="184" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32" text-anchor="middle">2</text><text x="480" y="248" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" text-anchor="middle">1/4</text><text x="320" y="310" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" text-anchor="middle">E(X)=0×1/4+1×1/2+2×1/4=1</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">Var(X) = (0−1)²/4+(1−1)²/2+(2−1)²/4 = 1/2</text></svg>