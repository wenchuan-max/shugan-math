<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img"><text x="320" y="35" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" text-anchor="middle">是否放回，决定每次机会会不会变化</text><rect x="40" y="85" width="270" height="220" rx="8" stroke="#A9DFB7" stroke-width="2" fill="#A9DFB70C"/><rect x="330" y="85" width="270" height="220" rx="8" stroke="#A6B3EE" stroke-width="2" fill="#A6B3EE0C"/><text x="175" y="128" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">放回抽：每次成功率相同</text><text x="465" y="128" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">不放回抽：后面机会改变</text><text x="175" y="195" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="30" text-anchor="middle">二项分布</text><text x="465" y="195" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="30" text-anchor="middle">超几何分布</text><text x="175" y="258" fill="#A9DFB7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" text-anchor="middle">独立重复n次</text><text x="465" y="258" fill="#A6B3EE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">总体N个，成功品M个</text><text x="320" y="357" fill="#EFB16F" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" text-anchor="middle">例：抽球后放回并混匀，才保持成功率不变。</text></svg>